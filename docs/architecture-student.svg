<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
  <title>How Willkie Badger AI works - student version</title>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1b1b1f"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-size="34" font-weight="700" fill="#1b1b1f">How Willkie Badger AI works</text>
  <text x="600" y="80" text-anchor="middle" font-size="18" fill="#555">A Cloud Architect decides how all of these pieces connect.</text>

  <!-- Google Cloud box -->
  <rect x="640" y="110" width="520" height="610" rx="24" fill="#f1f5fb" stroke="#4285f4" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="900" y="150" text-anchor="middle" font-size="26" font-weight="700" fill="#1a73e8">Google Cloud</text>
  <text x="900" y="178" text-anchor="middle" font-size="16" fill="#555">a giant building full of computers that anyone can rent</text>

  <!-- Flow column -->
  <g font-size="22" font-weight="700" text-anchor="middle">
    <!-- Student -->
    <rect x="120" y="120" width="400" height="80" rx="18" fill="#ffffff" stroke="#1b1b1f" stroke-width="3"/>
    <text x="320" y="153" fill="#1b1b1f">🧑‍🎓 Student</text>
    <text x="320" y="182" font-size="15" font-weight="400" fill="#555">asks a question (typing or 🎤)</text>

    <line x1="320" y1="200" x2="320" y2="238" stroke="#1b1b1f" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- Chat page -->
    <rect x="120" y="246" width="400" height="80" rx="18" fill="#fff6f7" stroke="#b3122b" stroke-width="3"/>
    <text x="320" y="279" fill="#1b1b1f">💬 Chat page (web app)</text>
    <text x="320" y="308" font-size="15" font-weight="400" fill="#555">the screen you see in the browser</text>

    <line x1="320" y1="326" x2="320" y2="364" stroke="#1b1b1f" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- Agent -->
    <rect x="120" y="372" width="400" height="80" rx="18" fill="#fff6f7" stroke="#b3122b" stroke-width="3"/>
    <text x="320" y="405" fill="#1b1b1f">🤖 AI agent (the program)</text>
    <text x="320" y="434" font-size="15" font-weight="400" fill="#555">follows the rules written in agent.py</text>

    <line x1="320" y1="452" x2="320" y2="490" stroke="#1b1b1f" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- Library -->
    <rect x="120" y="498" width="400" height="80" rx="18" fill="#fffbe6" stroke="#ffb703" stroke-width="3"/>
    <text x="320" y="531" fill="#1b1b1f">📚 School information (the library)</text>
    <text x="320" y="560" font-size="15" font-weight="400" fill="#555">a saved copy of the public school website</text>

    <line x1="320" y1="578" x2="320" y2="616" stroke="#1b1b1f" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- Answer -->
    <rect x="120" y="624" width="400" height="80" rx="18" fill="#ffffff" stroke="#1b1b1f" stroke-width="3"/>
    <text x="320" y="657" fill="#1b1b1f">✅ Answer appears + 🔊 Read Aloud</text>
    <text x="320" y="686" font-size="15" font-weight="400" fill="#555">only facts from the library, in friendly words</text>
  </g>

  <!-- Cloud services -->
  <g font-size="19" text-anchor="middle">
    <rect x="680" y="210" width="440" height="96" rx="16" fill="#ffffff" stroke="#4285f4" stroke-width="3"/>
    <text x="900" y="245" font-weight="700" fill="#1b1b1f">☁️ Cloud Run = where the app lives</text>
    <text x="900" y="272" font-size="15" fill="#555">runs the chat page and the agent so anyone can reach it</text>
    <text x="900" y="292" font-size="15" fill="#555">(today it can also run on the presenter's laptop)</text>

    <rect x="680" y="330" width="440" height="96" rx="16" fill="#ffffff" stroke="#4285f4" stroke-width="3"/>
    <text x="900" y="365" font-weight="700" fill="#1b1b1f">🧠 Gemini (Vertex AI) = the brain</text>
    <text x="900" y="392" font-size="15" fill="#555">the AI model that reads the facts and writes the answer</text>
    <text x="900" y="412" font-size="15" fill="#555">the agent talks to it through an API (a messenger)</text>

    <rect x="680" y="450" width="440" height="96" rx="16" fill="#ffffff" stroke="#4285f4" stroke-width="3"/>
    <text x="900" y="485" font-weight="700" fill="#1b1b1f">🔊 Text-to-Speech = the voice (optional)</text>
    <text x="900" y="512" font-size="15" fill="#555">turns the answer into audio for Read Aloud</text>
    <text x="900" y="532" font-size="15" fill="#555">if it is off, the browser's own voice is used</text>

    <rect x="680" y="570" width="440" height="96" rx="16" fill="#ffffff" stroke="#4285f4" stroke-width="3"/>
    <text x="900" y="605" font-weight="700" fill="#1b1b1f">🔐 Identity + Secrets = the keys</text>
    <text x="900" y="632" font-size="15" fill="#555">the app gets its own ID badge (service account)</text>
    <text x="900" y="652" font-size="15" fill="#555">so no passwords are ever written in the code</text>
  </g>

  <!-- connectors from flow to cloud -->
  <g stroke="#4285f4" stroke-width="3" stroke-dasharray="8 6" fill="none">
    <path d="M520,286 C600,286 600,258 680,258"/>
    <path d="M520,412 C600,412 600,378 680,378"/>
    <path d="M520,664 C600,664 600,498 680,498"/>
  </g>

  <text x="600" y="745" text-anchor="middle" font-size="15" fill="#777">Code = instructions · AI model = the brain · School website = the library · API = a messenger · Cloud Run = where the app lives · Cloud Architect = the person who fits it all together</text>
</svg>
